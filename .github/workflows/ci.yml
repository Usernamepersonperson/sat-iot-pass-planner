name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q -p no:asyncio
      - run: python -m sat_iot_pass_planner validate
      - run: python -m sat_iot_pass_planner demo --synthetic --days 2 --out results_ci   # offline, made-up orbits
